[package]
name = "sdrmm-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "sdrmm-desktop"
path = "src/main.rs"

[lints]
workspace = true

# Passthrough so the desktop app mirrors the server binary's backend gate (PLAN §3).
[features]
default = ["soapy", "rtl-native", "hackrf-native"]
soapy = ["sdrmm-server/soapy", "sdrmm-engine/soapy"]
rtl-native = ["sdrmm-server/rtl-native", "sdrmm-engine/rtl-native"]
hackrf-native = ["sdrmm-server/hackrf-native", "sdrmm-engine/hackrf-native"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sdrmm-server.workspace = true
sdrmm-engine.workspace = true
anyhow.workspace = true
tauri = { version = "2", features = [] }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
