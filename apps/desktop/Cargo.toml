[package]
name = "sdrmm-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "sdrmm-desktop"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["soapy", "sdrplay", "rtlsdr", "hackrf", "net-client", "gpu-fft"]
soapy = ["sdrmm-server/soapy", "sdrmm-engine/soapy", "dep:sdrmm-device-soapy"]
sdrplay = ["sdrmm-server/sdrplay", "sdrmm-engine/sdrplay"]
rtlsdr = ["sdrmm-server/rtlsdr", "sdrmm-engine/rtlsdr"]
hackrf = ["sdrmm-server/hackrf", "sdrmm-engine/hackrf"]
net-client = ["sdrmm-server/net-client", "sdrmm-engine/net-client"]
gpu-fft = ["sdrmm-server/gpu-fft", "sdrmm-engine/gpu-fft"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sdrmm-server.workspace = true
sdrmm-engine.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }
anyhow.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# Not used directly: `generate_context!` expands the config's `plugins` section into
# `serde_json` paths resolved against this crate's root.
serde_json.workspace = true
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
