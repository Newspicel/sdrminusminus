[package]
name = "sdrmm"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sdrmm"
path = "src/main.rs"

[lints]
workspace = true

# Passthrough so specialized builds may deliberately omit local hardware support.
[features]
default = ["soapy", "sdrplay", "rtlsdr", "hackrf", "net-client", "gpu-fft"]
soapy = ["sdrmm-server/soapy", "sdrmm-engine/soapy", "dep:sdrmm-device-soapy"]
sdrplay = ["sdrmm-server/sdrplay", "sdrmm-engine/sdrplay"]
rtlsdr = ["sdrmm-server/rtlsdr", "sdrmm-engine/rtlsdr"]
hackrf = ["sdrmm-server/hackrf", "sdrmm-engine/hackrf"]
net-client = ["sdrmm-server/net-client", "sdrmm-engine/net-client"]
gpu-fft = ["sdrmm-server/gpu-fft", "sdrmm-engine/gpu-fft"]

[dependencies]
sdrmm-server.workspace = true
sdrmm-engine.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
clap.workspace = true
anyhow.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
