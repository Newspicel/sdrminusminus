[package]
name = "sdrmm"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sdrmm"
path = "src/main.rs"

[lints]
workspace = true

# Passthrough so `cargo build -p sdrmm --no-default-features` is Soapy-free (PLAN §3).
[features]
default = ["soapy"]
soapy = ["sdrmm-server/soapy", "sdrmm-engine/soapy"]

[dependencies]
sdrmm-server.workspace = true
sdrmm-engine.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
clap.workspace = true
anyhow.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
