# Single-service deployment of the sdr-- image (: Pi/NAS with USB passthrough).
#   docker compose up -d   → http://<host>:8080
services:
  sdrmm:
    image: ghcr.io/newspicel/sdrminusminus:latest
    # Present so `docker compose up` can build from this checkout when the image is not
    # already local; `docker compose pull` fetches the published multi-arch image instead.
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Database, SigMF recordings, and any self-signed TLS material; the image passes
      # --db/--recordings-dir under /data and keeps a certificate beside them.
      - sdrmm-data:/data
    devices:
      # The whole USB bus, not one node: which bus/device an SDR lands on is decided at plug
      # time, and the engine enumerates all of them.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # `devices:` whitelists only the nodes that existed when the container started, so a
      # replugged SDR comes back as a new minor and is blocked — which defeats auto-reconnect.
      # 189 is the char major of the usbfs nodes under /dev/bus/usb.
      - "c 189:* rmw"
    # The image runs as an unprivileged user, so it needs the group that owns the device node
    # — numerically, since the group name would have to resolve inside the container. 46 is
    # plugdev, which is what the vendor udev rules grant on Debian and Ubuntu. Where no rule is
    # installed the node stays root:root 0664, so add "0" as well. `stat -c '%g %G %a'
    # /dev/bus/usb/*/*` on the host names the group to use, and so does Check hardware.
    group_add: ["46"]
    restart: unless-stopped

volumes:
  sdrmm-data:
