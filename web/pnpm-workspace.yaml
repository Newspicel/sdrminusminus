overrides:
  # GHSA advisory: js-yaml < 4.3.1, via openapi-typescript.
  js-yaml: "^4.3.1"
  # Babel 7 (required by babel-plugin-react-compiler) asks for semver `^6.3.1`, whose 6.3.1
  # carries no provenance and is refused by the trust policy below. Every semver API Babel
  # calls is unchanged in 7.x.
  semver: "^7.8.5"

# A version whose supply-chain trust evidence (provenance, signatures) is weaker than an
# earlier-published one is refused rather than accepted quietly, on fresh resolution and on every
# re-read of the lockfile. `minimumReleaseAge` is deliberately left at pnpm's 24-hour default:
# raising it to a week would reject the pinned biome and oxlint releases until they age past the
# cutoff, so it is a version-pinning decision, not a switch.
trustPolicy: no-downgrade
