overrides:
  # GHSA advisory: js-yaml < 4.3.1, via openapi-typescript.
  js-yaml: "^4.3.1"
  # Babel 7 (required by babel-plugin-react-compiler) asks for semver `^6.3.1`, whose 6.3.1
  # carries no provenance and is refused by the trust policy below. Every semver API Babel
  # calls is unchanged in 7.x.
  semver: "^7.8.5"

# A version whose supply-chain trust evidence (provenance, signatures) is weaker than an
# earlier-published one is refused rather than accepted quietly, on fresh resolution and on every
# re-read of the lockfile.
trustPolicy: no-downgrade

# A release has to sit in the registry for a day before this repo will install it, so a
# compromised publish has a window in which to be caught. Held at 24 hours rather than a week
# because a week would reject the pinned biome and oxlint releases until they age past the
# cutoff, so it is a version-pinning decision, not a switch. `cargo` runs the same gate over
# crates — see `.cargo/config.toml`.
minimumReleaseAge: 1440

# Versions taken before they age out. Each one is a hole in the gate above: name the exact
# version, and drop the entry once it is older than the cutoff.
minimumReleaseAgeExclude:
  - lucide-react@1.40.0
