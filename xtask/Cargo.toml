[package]
name = "xtask"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sdrmm-server.workspace = true
sdrmm-recorder.workspace = true
sdrmm-device-virtual.workspace = true
# `fixtures` renders the decoder reference signals (PLAN §14) with the same modulators the
# decoder tests use, so a fixture can never drift from what the decoders are tested against.
sdrmm-channels = { workspace = true, features = ["test-signals"] }
# The APRS fixture is keyed by the real modulator, which is configured with wire types.
sdrmm-wire.workspace = true
num-complex.workspace = true
clap.workspace = true
anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
