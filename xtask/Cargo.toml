[package]
name = "xtask"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sdrmm-server.workspace = true
xtask-release.workspace = true
sdrmm-recorder.workspace = true
sdrmm-device-virtual.workspace = true
sdrmm-channels = { workspace = true, features = ["fixtures"] }
# The APRS fixture is keyed by the real modulator, which is configured with wire types.
sdrmm-wire.workspace = true
sdrmm-modem-test-support.workspace = true
sdrmm-dsp.workspace = true
num-complex.workspace = true
rustfft.workspace = true
notify.workspace = true
clap.workspace = true
anyhow.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
flate2.workspace = true
tract-onnx.workspace = true
tract-nnef.workspace = true
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services.workspace = true
objc2-core-foundation.workspace = true

[dev-dependencies]
tempfile.workspace = true
