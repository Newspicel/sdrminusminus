[package]
name = "xtask"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sdrmm-server.workspace = true
sdrmm-recorder.workspace = true
sdrmm-device-virtual.workspace = true
sdrmm-channels = { workspace = true, features = ["test-signals"] }
# The APRS fixture is keyed by the real modulator, which is configured with wire types.
sdrmm-wire.workspace = true
sdrmm-modem.workspace = true
num-complex.workspace = true
clap.workspace = true
anyhow.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
