name: Nightly

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

  measurements:
    name: Measurements (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: nightly
      - name: Modem gates
        run: cargo test -p sdrmm-modem -p sdrmm-modem-test-support --release -- --ignored --skip write_perf_baseline
      - name: Channel baselines
        run: cargo test -p sdrmm-channels --release -- --ignored --skip write_perf_baseline
      - name: BER curves
        run: cargo run -p xtask -- ber bpsk-ideal --full
      - name: Modem benches
        run: cargo bench -p sdrmm-modem -- --test
      - name: DSP benches
        run: cargo bench -p sdrmm-dsp -- --test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ber-curves
          path: target/ber
          if-no-files-found: ignore
          retention-days: 14

  sanitizers:
    name: Sanitizers (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: sanitize
      - run: cargo xtask sanitize

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: [channel_chain, channel_settings, dv_voice]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: cargo xtask fuzz --target ${{ matrix.target }} --seconds 14400 --jobs 4
      - name: Minimize corpus
        if: always()
        run: cargo xtask fuzz --target ${{ matrix.target }} --minimize
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
