name: Nightly

on:
  schedule:
    # ~03:00 UTC, off the whole hour: GitHub delays or drops on-the-hour cron load spikes.
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  # Never cancel a measurement mid-sweep: a manual dispatch queues behind the scheduled run
  # instead of killing it, and overlap is rare enough that waiting is the cheaper policy.
  cancel-in-progress: false

jobs:
  measurements:
    name: Full measurements (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned nightly + rustfmt/clippy from rust-toolchain.toml.
      - run: rustup show
      # Its own cache key: everything here builds in release, so sharing the gate's
      # debug-profile cache would just thrash both.
      - uses: ./.github/actions/media-deps
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly
      # `-- --ignored` selects exactly the tests the crate marks as nightly-tier: the full
      # BPSK-vs-erfc calibration gate and the perf-baseline comparison. `write_perf_baseline`
      # is excluded by name — it rewrites the committed baseline file the comparison reads,
      # which on a runner would both race the compare test and quietly turn the gate into
      # measured-vs-just-measured. It is run deliberately, on the reference host only.
      - name: modem full gates
        run: cargo test -p sdrmm-modem -p sdrmm-modem-test-support --release -- --ignored --skip write_perf_baseline
      - name: channels full baselines
        run: cargo test -p sdrmm-channels --release -- --ignored --skip write_perf_baseline
      # The harness calibration entry over its full 0–10 dB grid, written as JSON + CSV and
      # judged against the exact erfc form — a FAIL is a nonzero exit, no output parsing.
      - name: ber curves (full grid)
        run: cargo run -p xtask -- ber bpsk-ideal --full
      # Criterion in --test mode: every bench target runs once, proving the perf harness
      # stays buildable and runnable. The measured numbers gate above via the committed JSON
      # baselines; a shared runner's Criterion timings would be noise, so none are recorded.
      - name: benches stay runnable
        run: |
          cargo bench -p sdrmm-modem -- --test
          cargo bench -p sdrmm-dsp -- --test
      # `xtask ber` writes its files even on FAIL — a failing curve is exactly the one worth
      # looking at, and without this it dies with the runner.
      - name: keep the measured curves
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ber-curves
          path: target/ber
          if-no-files-found: ignore
          retention-days: 14

  sanitizers:
    name: Decoder sanitizers (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The vendored AMBE and FDMDV sources are the only C the workspace compiles itself, and
      # they decode whatever bits an antenna hands them. clang instruments them; the address pass
      # needs clang's runtime for the C and Rust's own for everything else, so both are built
      # against the same sanitizer.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
      - run: rustup show
      # Its own key: both passes build the workspace with sanitizer flags, which nothing else
      # here or in ci.yml can reuse.
      - uses: ./.github/actions/media-deps
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sanitize
      - name: cargo xtask sanitize
        run: cargo xtask sanitize

  fuzz:
    name: Fuzz ${{ matrix.target }} (ubuntu)
    runs-on: ubuntu-24.04
    # GitHub kills a job at six hours. The budget below plus a cold build and a corpus replay
    # fits inside this with room to spare, so a run ends by finishing rather than by being cut.
    timeout-minutes: 330
    strategy:
      # One target finding a crash must not cancel the other two: they are independent searches,
      # and the night's other corpora are worth keeping either way.
      fail-fast: false
      matrix:
        target: [channel_chain, channel_settings, dv_voice]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: ./.github/actions/media-deps
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Restore and save are split so the corpus is stored even when the run fails — the night a
      # target finds a crash is the night its inputs are worth most.
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: cargo xtask fuzz
        run: cargo xtask fuzz --target ${{ matrix.target }} --seconds 14400 --jobs 4
      # Without this the corpus only grows, and libFuzzer replays all of it before fuzzing
      # anything — eventually the replay is the run. `cmin` keeps one input per coverage edge.
      - name: shrink the corpus for tomorrow
        if: always()
        run: cargo xtask fuzz --target ${{ matrix.target }} --minimize
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # libFuzzer writes the input that crashed to fuzz/artifacts; without this it dies with the
      # runner and the failure is a stack trace with nothing to reproduce it.
      - name: keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
