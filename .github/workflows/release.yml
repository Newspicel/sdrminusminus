# Release artifacts (PLAN §15, milestone M5). Tag-driven; workflow_dispatch builds and uploads
# everything without publishing, so the pipeline can be exercised off a branch.
#
# Two rules run through every job here:
#  - the web UI is built first and its presence asserted. crates/server/build.rs creates
#    web/dist when it is missing, so a Rust build with no UI *succeeds* and ships a 503 "not
#    built" page — a silent failure this workflow exists to prevent.
#  - binaries are built `--no-default-features` (drops `soapy`, whose sys crate links
#    libSoapySDR) with the native pure-Rust backends on, because release artifacts must launch
#    with no shared library installed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ghcr requires a lowercase path; `newspicel/sdrminusminus` already is one.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # Built once and shared, so every artifact of a release embeds byte-identical assets.
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: Assert the UI built
        run: test -f web/dist/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: sdrmm (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    # Every entry is a native runner — GitHub's hosted arm64 Linux runners remove the need to
    # cross-compile or emulate, so no sysroot, no cargo-zigbuild, no QEMU. The OS is pinned
    # rather than `-latest` because the build machine's glibc is the floor of every Linux
    # artifact we ship, and a silent bump would strand older Pi installs.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Assert the UI is present
        run: test -f web/dist/index.html
      # audiopus_sys builds vendored libopus through the cmake crate.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      # Installs the pinned nightly from rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # `cargo xtask dist` is the intended entry point (CLAUDE.md); until it lands with a
      # defined output contract this job packages the binary directly.
      - name: Build
        run: cargo build --release --locked -p sdrmm --no-default-features --features rtl-native,hackrf-native
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          name="sdrmm-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # README.md and LICENSE are release contents, not optional: a missing one fails here.
          cp target/release/sdrmm README.md LICENSE "dist/$name/"
          # Linux only: on aarch64-apple-darwin the linker's ad-hoc code signature is required
          # for the binary to load at all, and `strip` invalidates it.
          if [ "$RUNNER_OS" = Linux ]; then strip "dist/$name/sdrmm"; fi
          # COPYFILE_DISABLE stops macOS bsdtar from emitting ._ AppleDouble members for
          # extended attributes; ignored by GNU tar.
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: sdrmm-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  image:
    name: Image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # One native runner per platform, each pushing an untagged manifest by digest; the merge
    # job below assembles them into one multi-arch tag. QEMU would work too and take hours.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Artifact names cannot contain "/".
      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The web build and its index.html assertion are stages of the Dockerfile itself, so the
      # image cannot be published without an embedded UI either.
      - id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Image manifest
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            bundles: dmg
          - label: linux-x86_64
            runner: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      # The Tauri shell serves the same embedded UI through the in-process server, so it needs
      # web/dist just as much as the headless binary does.
      - name: Assert the UI is present
        run: test -f web/dist/index.html
      # Tauri v2's Linux prerequisites; cmake is for audiopus_sys' vendored libopus.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev cmake file
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}
      # The action installs the Tauri CLI itself — nothing in this repo depends on it, and
      # apps/desktop has no package.json to hang a devDependency on.
      - uses: tauri-apps/tauri-action@v1
        env:
          # Unset secrets mean unsigned bundles: the .dmg still mounts, but Gatekeeper
          # quarantines the app and no notarization ticket is stapled, so users must clear the
          # quarantine attribute by hand. Set all five to publish signed, notarized builds.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: --no-default-features --features rtl-native,hackrf-native --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    # workflow_dispatch runs stop at the uploaded artifacts; only a tag publishes.
    if: github.ref_type == 'tag'
    needs: [binaries, image-manifest, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{sdrmm-*,desktop-*}"
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f -printf '%P\0' | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: \`docker pull ${IMAGE_NAME}:${GITHUB_REF_NAME#v}\`" \
            artifacts/*
