name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/newspicel/sdrminusminus
  SDRMM_RELEASE: ${{ github.ref_type == 'tag' && '1' || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tap: ${{ steps.tap.outputs.tap }}
    steps:
      - id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$previous" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        run: |
          case "$GITHUB_EVENT_NAME/$GITHUB_REF_TYPE" in
            schedule/*) version="$(date -u +%y.%-m.%-d)" ;;
            */tag) version="${GITHUB_REF_NAME#v}" ;;
            *) version=0.0.0 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: echo "tap=${TAP_TOKEN:+true}" >> "$GITHUB_OUTPUT"

  version:
    name: Stamp version
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: ubuntu
          save: false
      - run: cargo xtask set-version ${{ needs.plan.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: version-stamp
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: sdrmm (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            exe: .exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            exe: .exe
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STAGED: dist/sdrmm-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: release-${{ matrix.target }}
          target: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      - uses: ./.github/actions/node
      - run: cargo xtask dist --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: test -s "$STAGED.tar.gz" || test -s "$STAGED.zip"
      - name: Linking
        if: runner.os == 'macOS'
        run: cargo xtask link-check "$STAGED/sdrmm"
      - name: Version
        if: ${{ !matrix.cross }}
        shell: bash
        run: test "$("$STAGED/sdrmm${{ matrix.exe }}" --version)" = "sdrmm $VERSION"
      - name: Doctor
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          "$STAGED/sdrmm${{ matrix.exe }}" --doctor | tee doctor
          grep -q 'compiled backends:.*soapy' doctor
          grep -qi 'soapysdr' doctor
      - uses: actions/upload-artifact@v7
        with:
          name: sdrmm-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  source:
    name: Source tarball
    needs: version
    runs-on: ubuntu-24.04
    env:
      ROOT: sdrmm-${{ needs.version.outputs.version }}-src
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: source
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      - uses: ./.github/actions/node
      - run: cargo xtask source-dist
      - name: Contents
        run: |
          tar -tzf "dist/$ROOT.tar.gz" > listing
          grep -qx "$ROOT/apps/sdrmm/src/main.rs" listing
          grep -qx "$ROOT/web/dist/index.html" listing
          grep -qx "$ROOT/Cargo.lock" listing
          ! grep -qx "$ROOT/.cargo/config.toml" listing
      - name: Version
        run: tar -xzOf "dist/$ROOT.tar.gz" "$ROOT/Cargo.toml" | grep -qx 'version = "${{ needs.version.outputs.version }}"'
      - uses: actions/upload-artifact@v7
        with:
          name: sdrmm-source
          path: dist/*-src.tar.gz
          if-no-files-found: error

  image:
    name: Image (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux/${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux/${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Image manifest
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
      - name: Create manifest list
        working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t digests < <(printf "${IMAGE_NAME}@sha256:%s\n" *)
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - label: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_ARGS: >-
        --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        -- --no-default-features --features soapy,sdrplay,rtlsdr,hackrf,airspy,airspyhf,ad936x,net-client,gpu-fft
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: release-desktop-${{ matrix.label }}
          target: ${{ matrix.target }}
          tauri: true
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      - uses: ./.github/actions/node
      - run: pnpm --dir web build
      - name: UI built
        shell: bash
        run: test -f web/dist/index.html
      - if: contains(matrix.bundles, 'appimage')
        run: scripts/ci/prefetch-appimage-tools.sh "${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}"
      - id: bundle
        uses: tauri-apps/tauri-action@v1
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          FFMPEG_DIR: ${{ github.workspace }}/.media/${{ matrix.target }}
        with:
          projectPath: apps/desktop
          args: ${{ env.TAURI_ARGS }}
      - name: Clear failed DMG
        if: steps.bundle.outcome == 'failure'
        run: |
          shopt -s nullglob
          for volume in /Volumes/dmg.*; do hdiutil detach -force "$volume" || true; done
          rm -f "target/${{ matrix.target }}/release/bundle/macos"/rw.*.dmg
      - name: Bundle again
        if: steps.bundle.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          FFMPEG_DIR: ${{ github.workspace }}/.media/${{ matrix.target }}
          TAURI_CLI_VERBOSITY: 1
        with:
          projectPath: apps/desktop
          args: ${{ env.TAURI_ARGS }}
      - name: AppImage audio
        if: contains(matrix.bundles, 'appimage')
        run: scripts/ci/check-appimage-audio.sh "target/${{ matrix.target }}/release/bundle/appimage"
      - name: Collect bundles
        shell: bash
        run: scripts/ci/collect-bundles.sh "${{ matrix.target }}" "${{ needs.version.outputs.version }}"
      - name: Notarize disk image
        if: runner.os == 'macOS'
        run: |
          for dmg in bundles/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -v "$dmg"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: bundles/*
          if-no-files-found: error

  updater-manifest:
    name: Updater manifest
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: ubuntu
          save: false
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: desktop-*
          merge-multiple: true
      - name: Write latest.json
        env:
          TAG: ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
        run: |
          cargo xtask updater-manifest \
            --version "${{ needs.version.outputs.version }}" \
            --dir bundles \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --out latest.json
          cat latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: updater-manifest
          path: latest.json
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag' || github.event_name == 'schedule'
    needs: [version, binaries, source, image-manifest, updater-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{sdrmm-*,desktop-*,updater-manifest}"
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          find . -type f -printf '%P\0' | sort -z | xargs -0 shasum -a 256 > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*"
      - name: Publish release
        if: github.ref_type == 'tag'
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: \`docker pull ${IMAGE_NAME}:${VERSION}\`" \
            "${files[@]}"
      - name: Remove previous nightly
        if: github.event_name == 'schedule'
        run: gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
      - name: Publish nightly
        if: github.event_name == 'schedule'
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --prerelease \
            --notes "Build of \`main\` at ${GITHUB_SHA}. Replaced every night. Container image: \`docker pull ${IMAGE_NAME}:nightly\`" \
            "${files[@]}"

  homebrew:
    name: Homebrew tap
    if: github.ref_type == 'tag' && needs.plan.outputs.tap == 'true'
    needs: [plan, version, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          cache: ubuntu
          save: false
      - name: Fetch checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write formula and cask
        run: |
          cargo xtask homebrew-tap \
            --version "${{ needs.version.outputs.version }}" \
            --sums SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --out tap
      - name: Push tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sdrmm.rb Casks/sdrminusminus.rb
          git diff --cached --quiet && exit 0
          git commit -m "sdrmm ${{ needs.version.outputs.version }}"
          git push
