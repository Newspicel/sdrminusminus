# Release artifacts. Tag-driven; workflow_dispatch builds and uploads everything
# without publishing, so the pipeline can be exercised off a branch.
#
# Three rules run through every job here:
#
#  - The version comes from the tag and is stamped *once*, by the `version` job, which uploads
#    the rewritten Cargo.toml + Cargo.lock for everything downstream to check out over. Before
#    this existed the tag named the tarball and nothing else: bundles shipped as `0.0.0` and
#    `sdrmm --version` disagreed with the release it came from.
#
#  - Every artifact compiles the canonical Soapy backend. Desktop installers and containers
#    carry a pinned private runtime; headless archives deliberately document their matching
#    system-runtime prerequisite. The cargo flags live in `xtask`, not here.
#
#  - The web UI is built by whatever produces the artifact and its presence is then asserted.
#    crates/server/build.rs creates web/dist when it is missing, so a Rust build with no UI
#    *succeeds* and ships a 503 "not built" page — a silent failure this pipeline prevents.
#    `cargo xtask dist` does both, which is why one command reproduces a release artifact on a
#    laptop; the Dockerfile has the same two steps as its own stages.
#
# Three modes, one pipeline — the build jobs are identical in all of them and only the `version`
# job and the publish step know which is running:
#
#   tag       a real release, published from the tag's version
#   schedule  a nightly, published over the rolling `nightly` prerelease — but only if main has
#             moved since the last one, because a full matrix is twelve jobs and four of them
#             are macOS
#   dispatch  a rehearsal: builds and uploads everything, publishes nothing
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    # 03:00 UTC. Nothing downstream cares about the exact hour; this one is outside both
    # European and US working days, so a nightly is finished before anyone looks for it.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ghcr rejects an uppercase reference and `github.repository` carries the owner's canonical
  # casing (`Newspicel/…`), so the name is lowercased at use rather than interpolated raw.
  IMAGE_NAME: ghcr.io/newspicel/sdrminusminus
  # Enforced by `xtask check` against web/package.json and the Dockerfile — these three
  # are bumped by different tools and must move together.
  PNPM_VERSION: 11.15.1
  NODE_VERSION: 26

jobs:
  version:
    name: Stamp version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      # Every build job below hangs off this. Only a nightly can ever set it false.
      changed: ${{ steps.stamp.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      # Building xtask reaches sdrmm-server, so opusic-sys' vendored libopus is compiled here
      # too — the one reason a manifest edit needs a C toolchain.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu
          save-if: false
      - id: stamp
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # The `nightly` tag is the marker: it points at the commit the last published
            # nightly was built from. Resolving it through /commits/ rather than reading the
            # ref dereferences the tag object, so this compares commit to commit.
            previous="$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)"
            if [ "$previous" = "$GITHUB_SHA" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "main is unchanged since the last nightly ($previous) — nothing to build."
              exit 0
            fi
            # YY.M.D, and every part of that is forced. It has to be plain major.minor.patch
            # with major <= 255, so neither `0.0.0-nightly.x` nor a four-digit year survives
            # the MSI bundler (`xtask set-version` rejects both up front). This says which
            # night a build came from, which is the whole point of running `sdrmm --version`
            # on a nightly; the commit is in the release notes.
            version="$(date -u +%y.%-m.%-d)"
          elif [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            # Dispatch runs are rehearsals and are never published, so they keep the manifest's
            # own version.
            version=0.0.0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cargo xtask set-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Two files, and every build job below starts by checking them out over its own copy.
      - uses: actions/upload-artifact@v7
        if: steps.stamp.outputs.changed == 'true'
        with:
          name: version-stamp
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: sdrmm (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            conda-platform: linux-64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            conda-platform: linux-aarch64
          - target: aarch64-apple-darwin
            runner: macos-15
            conda-platform: osx-arm64
          # The one cross build: Apple ships both slices in a single SDK, so the arm64 runner
          # produces the Intel binary without a sysroot of its own.
          - target: x86_64-apple-darwin
            runner: macos-15
            conda-platform: osx-64
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            conda-platform: win-64
    # Every other entry is a native runner — GitHub's hosted arm64 Linux runners remove the need
    # to cross-compile or emulate, so no sysroot, no cargo-zigbuild, no QEMU. The OS is pinned
    # rather than `-latest` because the build machine's glibc is the floor of every Linux
    # artifact we ship, and a silent bump would strand older Pi installs.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned nightly from rust-toolchain.toml; `xtask dist` adds the cross
      # target itself when `--target` names something other than the host.
      - run: rustup show
      # Before the version stamp on purpose: rust-cache keys on Cargo.lock, and stamping
      # rewrites every workspace entry in it. Restoring first means a release reuses the
      # dependency artifacts `main` already built, and only the workspace crates rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      - id: soapy
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: 2.8.1-0
          environment-file: packaging/soapy/conda-${{ matrix.conda-platform }}.lock
          environment-name: sdrmm-soapy-${{ matrix.target }}
          create-args: --platform ${{ matrix.conda-platform }}
          cache-environment: true
      # The build is pointed at a prefix holding SoapySDR alone, never at the environment: the
      # linker searches whatever prefix `soapysdr-sys` reports for every `-l` on the line, and
      # 0.1.2 shipped a macOS binary bound to conda's libiconv because of it — see
      # packaging/soapy/link-prefix.sh.
      #
      # The loader paths are deliberately not job-wide either. On macOS a job-wide
      # DYLD_LIBRARY_PATH reaches every process the runner starts and hands them this
      # environment's libiconv/libz instead of the system ones: gtar died on
      # `Symbol not found: _iconv` and lost every cache, and cargo segfaulted before printing a
      # line. Whatever needs the pinned runtime at *run* time asks for it per step.
      - name: Configure pinned Soapy build runtime
        shell: bash
        env:
          PREFIX: ${{ steps.soapy.outputs.environment-path }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$PREFIX/Library/bin" >> "$GITHUB_PATH"
          else
            packaging/soapy/link-prefix.sh "$PREFIX" "$RUNNER_TEMP/soapy-link"
            echo "SOAPY_SDR_ROOT=$RUNNER_TEMP/soapy-link" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/soapy-link/lib/pkgconfig" >> "$GITHUB_ENV"
            if [ "$RUNNER_OS" = Linux ]; then
              echo "LD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"
            fi
          fi
      # `xtask dist` builds the UI itself, so the toolchain has to be here rather than in a
      # shared artifact — which is also what lets one command reproduce this on a laptop.
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # opusic-sys builds vendored libopus through the cmake crate.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: cargo xtask dist
        run: cargo xtask dist --target ${{ matrix.target }}
      # An artifact that reports a version other than the one it is named after is exactly the
      # bug this pipeline was rebuilt to close, so assert it rather than trust it. The staged
      # directory holds the same files the archive was packed from, which keeps this one step
      # portable across all three shells instead of needing a per-OS unpacker.
      # The Intel build cannot run on the arm64 runner, so it is checked for presence only.
      - name: Smoke the artifact
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          SOAPY_LIB: ${{ steps.soapy.outputs.environment-path }}/lib
        run: |
          set -euo pipefail
          staged="dist/sdrmm-${VERSION}-${TARGET}"
          ls -l "$staged"
          test -s "$staged.tar.gz" || test -s "$staged.zip"
          # Reads the binary rather than running it, so the Intel slice is checked on the arm64
          # runner too. SoapySDR is the one library this archive expects the host to bring.
          if [ "$RUNNER_OS" = macOS ]; then
            cargo xtask link-check "$staged/sdrmm" --external libSoapySDR
          fi
          if [ "$TARGET" = x86_64-apple-darwin ]; then exit 0; fi
          bin="$staged/sdrmm"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          # The headless archive links the pinned SoapySDR without carrying it, so the loader
          # needs pointing at it — for this binary only, never for the job (see above).
          sdrmm() { DYLD_LIBRARY_PATH="$SOAPY_LIB" "$bin" "$@"; }
          printed="$(sdrmm --version)"
          echo "$printed"
          test "$printed" = "sdrmm $VERSION"
          doctor="$(sdrmm --doctor)"
          echo "$doctor"
          grep -q 'compiled backends:.*soapy' <<< "$doctor"
          grep -q 'core: 0.8.1' <<< "$doctor"
      - uses: actions/upload-artifact@v7
        with:
          name: sdrmm-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  image:
    name: Image (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # One native runner per platform, each pushing an untagged manifest by digest; the merge
    # job below assembles them into one multi-arch tag. QEMU would work too and take hours.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Into the build context, so the binary inside the image reports the release version too.
      # Unlike the cargo jobs this cannot be reordered around the cache: Cargo.toml is a layer
      # input to the Dockerfile's dependency-compilation stage, so a tag build recompiles the
      # dependency tree from cold. That is a few minutes per platform, on a workflow that runs
      # per release — cheaper than teaching the Dockerfile to stamp itself.
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      # Artifact names cannot contain "/".
      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The web build and its index.html assertion are stages of the Dockerfile itself, so the
      # image cannot be published without an embedded UI either.
      - id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Image manifest
    needs: [version, image]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # The semver patterns need a tag ref and produce nothing on the other two triggers,
          # which is why `latest` and `nightly` are raw and mutually exclusive: a nightly must
          # never be what `docker pull` gives someone who asked for no tag at all.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # both substitutions are argument lists, not one word
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `app` alongside `dmg` because the macOS updater artifact is the tarred `.app`, and
          # the bundler only emits it when `app` is an explicit target — with `dmg` alone it
          # builds the `.app`, wraps it, then deletes it, and the release loses its updater.
          - label: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            conda-platform: osx-arm64
          - label: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
            conda-platform: osx-64
          - label: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            conda-platform: linux-64
          - label: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            conda-platform: win-64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      # Before the version stamp, for the reason given in the binaries job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      # patchelf here rather than with the Tauri prerequisites below: staging sets the rpath of
      # every staged library before the bundle is built.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf
      - id: soapy
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: 2.8.1-0
          environment-file: packaging/soapy/conda-${{ matrix.conda-platform }}.lock
          environment-name: sdrmm-soapy-${{ matrix.target }}
          create-args: --platform ${{ matrix.conda-platform }}
          cache-environment: true
      - name: Stage private Soapy runtime
        shell: bash
        env:
          PREFIX: ${{ steps.soapy.outputs.environment-path }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$PREFIX/Library/bin" >> "$GITHUB_PATH"
            # pwsh here and below, never `powershell`: Windows PowerShell 5.1 reads a UTF-8
            # script as the machine's ANSI codepage, and one non-ASCII byte in a message then
            # decodes into a quote that ends the string and breaks the parse.
            pwsh -NoProfile -File packaging/soapy/stage-windows.ps1 \
              -Prefix "$PREFIX" -Destination apps/desktop/resources/soapy
          else
            # SoapySDR alone on the link line, and not DYLD_LIBRARY_PATH — both for the reasons
            # spelled out in the binaries job. The bundle carries its own copy of this runtime
            # anyway; nothing here runs against the environment's.
            packaging/soapy/link-prefix.sh "$PREFIX" "$RUNNER_TEMP/soapy-link"
            echo "SOAPY_SDR_ROOT=$RUNNER_TEMP/soapy-link" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/soapy-link/lib/pkgconfig" >> "$GITHUB_ENV"
            if [ "$RUNNER_OS" = Linux ]; then
              echo "LD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"
            fi
            packaging/soapy/stage-unix.sh "$PREFIX" apps/desktop/resources/soapy
          fi
          cargo xtask soapy-bundle-check
      - name: Sign the staged Soapy runtime
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "no Developer ID certificate — leaving the payload unsigned, which is what" \
                 "tauri-action does with the app itself when the same secrets are missing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/soapy-signing.keychain-db"
          certificate="$RUNNER_TEMP/soapy-signing.p12"
          password="$(uuidgen)"
          previous="$(security list-keychains -d user | tr -d ' "' | tr '\n' ' ')"
          # Both halves of the undo, so a failed signature cannot leave the certificate on disk
          # or a dangling entry in the search list for tauri-action to trip over.
          cleanup() {
            rm -f "$certificate"
            # shellcheck disable=SC2086  # a keychain list is a list of arguments, not one word
            security list-keychains -d user -s $previous
            security delete-keychain "$keychain" 2>/dev/null || true
          }
          trap cleanup EXIT
          base64 --decode <<< "$APPLE_CERTIFICATE" > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $previous
          find apps/desktop/resources/soapy -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 codesign --force --timestamp --options runtime \
                --sign "$APPLE_SIGNING_IDENTITY"
          find apps/desktop/resources/soapy -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 codesign --verify --strict
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Tauri v2's Linux prerequisites; cmake is for opusic-sys' vendored libopus.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev cmake file
      # tauri-action drives the bundle itself, so the UI has to be on disk before it starts —
      # the Tauri shell serves the same embedded UI through the in-process server, and needs
      # web/dist just as much as the headless binary does.
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: Assert the UI built
        shell: bash
        run: test -f web/dist/index.html
      # The AppImage bundler shells out to linuxdeploy, which it does not vendor: on the first
      # bundle it pulls AppRun and the linuxdeploy tools from GitHub with one retry-less
      # request each, and a dropped connection there kills the whole job *after* the release
      # build has already been paid for (`failed to bundle project: io: Peer disconnected`).
      # It only downloads what is missing from its tools directory, so fetching the same set
      # here — with retries, and with each file moved into place only once it is complete —
      # leaves the bundler with nothing to fetch and no network to be flaky.
      - name: Prefetch the AppImage tooling
        if: runner.os == 'Linux' && contains(matrix.bundles, 'appimage')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          arch="${TARGET%%-*}"
          tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools"
          fetch() {
            if ! curl --fail --location --silent --show-error \
                 --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                 --output "$tools/$2.part" "$1" || [ ! -s "$tools/$2.part" ]; then
              rm -f "$tools/$2.part"
              return 1
            fi
            chmod +x "$tools/$2.part"
            mv "$tools/$2.part" "$tools/$2"
          }
          releases=https://github.com/tauri-apps/binary-releases/releases/download
          plugins=https://raw.githubusercontent.com/tauri-apps
          fetch "$releases/apprun-old/AppRun-$arch" "AppRun-$arch"
          # Upstream rather than the mirror the bundler would use: the pinned mirror predates the
          # GTK and GStreamer plugin contract the staged runtime is deployed with.
          fetch "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage" \
            "linuxdeploy-$arch.AppImage"
          fetch "$plugins/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" linuxdeploy-plugin-gtk.sh
          fetch "$plugins/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh" linuxdeploy-plugin-gstreamer.sh
          # The one optional tool — linuxdeploy carries its own older copy — so a miss here is
          # the bundler's own fallback, not a failed release. Note the name it is stored under
          # drops the architecture the URL carries.
          fetch "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-$arch.AppImage" \
            linuxdeploy-plugin-appimage.AppImage \
            || echo "AppImage plugin unavailable — linuxdeploy will use its built-in version."
          ls -l "$tools"
      # `cargo xtask desktop --bundles` is the same build locally. CI goes through the action
      # because signing a macOS bundle needs the certificate imported into a temporary keychain
      # first, and that is the action's job.
      - uses: tauri-apps/tauri-action@v1
        env:
          # macOS bundles are signed and notarized, which is what these six carry: the first
          # three are the Developer ID Application certificate, the last three are the notary
          # credentials. Tauri creates and unlocks its own temporary keychain from the .p12, so
          # there is no KEYCHAIN_PASSWORD to set here.
          # If any are missing the build still succeeds and produces an *unsigned* .dmg —
          # Gatekeeper then quarantines the app with no ticket to staple, and users have to
          # clear the quarantine attribute by hand.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The updater's own signature, unrelated to the Apple ones above: the client trusts
          # only this key, and `createUpdaterArtifacts` produces nothing without it. Missing here
          # means a release with no `.sig` files, which the collect step below refuses.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --no-default-features --features soapy,sdrplay,rtlsdr,hackrf,net-client,gpu-fft
      - name: Verify packaged Soapy payload
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          # One listing per artifact, matched three times against it. Piping into `grep -q`
          # instead closes the pipe on the first hit, the producer dies of SIGPIPE mid-listing,
          # and `pipefail` then reports a *passing* check as a failed step ("tar: stdout: write
          # error", exit 2). The listing is printed when a name is missing, because the failure
          # that matters — a payload that never reached the bundle — and the one that does not —
          # a listing tool that cannot name what it holds — look identical from a bare exit code.
          carries() {
            local listing="$1" artifact="$2" module
            for module in soapysdr airspy bladerf; do
              if ! grep -qi "$module" <<< "$listing"; then
                echo "$artifact carries no $module. It holds:" >&2
                echo "$listing" >&2
                exit 1
              fi
            done
            echo "$artifact carries the private Soapy runtime."
          }
          if [ "$RUNNER_OS" = macOS ]; then
            app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            carries "$(find "$app/Contents/Resources/soapy")" "$app"
            # Carrying the runtime is half of it. This is the other half: every library the
            # bundle's binaries name has to resolve from inside the bundle or out of the shared
            # cache, which is what 0.1.2 got wrong — it shipped a complete Soapy payload and a
            # main binary that asked for a libiconv nobody had.
            cargo xtask link-check "$app"
          elif [ "$RUNNER_OS" = Linux ]; then
            deb="$(find "$bundle/deb" -name '*.deb' -print -quit)"
            carries "$(dpkg-deb --contents "$deb")" "$deb"
          else
            # The NSIS installer, and only it: an MSI keeps its payload in one embedded cabinet
            # whose entries are WiX's own file ids, so `7z l` on it lists `app.cab` and nothing
            # else to match. Both installers come out of the same bundler run over the same
            # staged tree, so the one that can be read for its contents stands for both.
            installer="$(find "$bundle/nsis" -name '*-setup.exe' -print -quit)"
            test -n "$installer"
            carries "$(7z l "$installer")" "$installer"
            # Carrying the runtime is half of it, and on Windows the other half is *where*. The
            # binary imports SoapySDR.dll, so the loader resolves it out of the executable's own
            # directory before `main` runs — a payload installed only under `soapy\` kills the
            # process with a system error dialog. The bundlers key their resource table by
            # source path, so listing one file under two destinations silently drops one of
            # them; this asserts the layout the loader needs rather than the bundler's input.
            payload="$RUNNER_TEMP/nsis-payload"
            rm -rf "$payload"
            7z x -y -o"$payload" "$installer" > /dev/null
            exe="$(find "$payload" -name '*.exe' -not -path '*PLUGINSDIR*' -print -quit)"
            core="$(find "$payload" -iname 'SoapySDR.dll' -print -quit)"
            if [ -z "$exe" ] || [ -z "$core" ]; then
              echo "$installer holds no executable and SoapySDR.dll to compare. It extracted:" >&2
              find "$payload" >&2
              exit 1
            fi
            if [ "$(dirname "$exe")" != "$(dirname "$core")" ]; then
              echo "$installer installs $core, but the loader searches $(dirname "$exe")" >&2
              find "$payload" >&2
              exit 1
            fi
            module="$(find "$payload" -ipath '*/soapy/lib/SoapySDR/modules0.8/*airspy*' -print -quit)"
            if [ -z "$module" ]; then
              echo "$installer installs no Soapy module where the app points SOAPY_SDR_PLUGIN_PATH." >&2
              find "$payload" >&2
              exit 1
            fi
            echo "$installer installs SoapySDR.dll beside the executable and its modules under soapy/."
          fi
      # Flattened first: upload-artifact roots a multi-path artifact at the least common
      # ancestor of its search paths, which would nest the bundles under dmg/ deb/ appimage/
      # — and the release job below treats every downloaded entry as a file to attach.
      # Tauri v2 reuses the AppImage and Windows installers as updater payloads; macOS still
      # archives the `.app`. The installers are also what a human downloads. Everything goes to
      # the release, and `latest.json` is built from the signatures — so a dropped `.sig` here is
      # a platform that silently stops updating.
      - name: Collect bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p bundles
          # Bundles sit one directory under `bundle/`; `-maxdepth 2` keeps the walk out of the
          # `.app` the macOS `app` target leaves behind, whose payload is not ours to collect.
          find "target/$TARGET/release/bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} bundles/ \;
          # macOS names its updater artifact after the product alone (`sdr--.app.tar.gz`), with
          # no architecture in it — so both slices would reach one release under the same name
          # and whichever uploaded second would win. The other three targets carry their arch.
          if [ "$RUNNER_OS" = macOS ]; then
            arch="${TARGET%%-*}"
            for f in bundles/*.app.tar.gz; do
              mv "$f" "${f%.app.tar.gz}_${VERSION}_${arch}.app.tar.gz"
              mv "$f.sig" "${f%.app.tar.gz}_${VERSION}_${arch}.app.tar.gz.sig"
            done
          fi
          # An unsigned bundle still builds and still installs; it just can never be updated
          # from, and nothing downstream notices until a release reaches nobody. Every strand of
          # this matrix emits at least one updater artifact, so this is unconditional.
          test -n "$(find bundles -name '*.sig')" \
            || { echo "no .sig files — is TAURI_SIGNING_PRIVATE_KEY set?" >&2; exit 1; }
          ls -l bundles
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: bundles/*
          if-no-files-found: error

  # Runs on a dispatch rehearsal too, deliberately: this is the one job whose input is the whole
  # desktop matrix at once, so a bundler rename that collapses two platforms into one entry is
  # only visible here. Rehearsing it off a branch is what keeps that from surfacing on tag day.
  updater-manifest:
    name: Updater manifest
    needs: [version, desktop]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      # Before the download: checkout cleans the workspace and would take `bundles/` with it.
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: desktop-*
          merge-multiple: true
      - name: Write latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A tag serves the manifest from its own release; the nightly from the rolling one. A
          # dispatch has neither, and only exercises the generator.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then tag=nightly; else tag="$GITHUB_REF_NAME"; fi
          cargo xtask updater-manifest \
            --version "$VERSION" \
            --dir bundles \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" \
            --out latest.json
          cat latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: updater-manifest
          path: latest.json
          if-no-files-found: error

  release:
    name: GitHub Release
    # workflow_dispatch runs stop at the uploaded artifacts; a tag and a nightly publish.
    if: github.ref_type == 'tag' || github.event_name == 'schedule'
    needs: [version, binaries, image-manifest, desktop, updater-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Provenance: every published file gets a signed statement tying it to this workflow at
      # this commit, verifiable with `gh attestation verify <file> --repo <repo>`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{sdrmm-*,desktop-*,updater-manifest}"
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          # `! -name SHA256SUMS`: the redirect creates the file before `find` runs, so without
          # it the manifest lists itself — hashed while still empty, since it sorts first.
          # shellcheck disable=SC2094  # that exclusion is exactly what makes this safe
          find . -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*"
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # shellcheck disable=SC2046  # the find is an asset list, one argument per file
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: \`docker pull ${IMAGE_NAME}:${VERSION}\`" \
            $(find artifacts -type f | sort)

      # Rolling, so the download URLs are stable and always point at the newest build. The tag
      # is deleted with the release and recreated at this commit, which is also what makes it
      # usable as the change marker the `version` job reads — the tag *is* the record of what
      # the last nightly was built from.
      - name: Publish nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          notes=$(cat <<EOF
          Automated build of \`main\` at ${GITHUB_SHA}, published $(date -u '+%Y-%m-%d %H:%M UTC').

          Unstable by definition: this is whatever was on \`main\` last night, not a release.
          It is replaced every night, so these download URLs always point at the newest build.

          Container image: \`docker pull ${IMAGE_NAME}:nightly\`
          EOF
          )
          # shellcheck disable=SC2046  # the find is an asset list, one argument per file
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --prerelease \
            --notes "$notes" \
            $(find artifacts -type f | sort)

  # The tap points Homebrew at files the release job just published, so it can only be written
  # once they exist. Tags only: `brew upgrade` must never move a stable install onto the rolling
  # nightly. The tap lives in a second repository, which is why this needs a token of its own —
  # without one the job stops at the guard rather than failing a release that already shipped.
  homebrew:
    name: Homebrew tap
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Guard
        id: guard
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is unset: skipping the tap update." >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
      - if: steps.guard.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - if: steps.guard.outputs.ready == 'true'
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          shared-key: ubuntu
          save-if: false
      # The published manifest rather than a rebuilt one: a tap that disagrees with the release it
      # names hands every `brew install` a checksum mismatch.
      - name: Fetch the published checksums
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
      - name: Check out the tap
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write the formula and the cask
        if: steps.guard.outputs.ready == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo xtask homebrew-tap \
            --version "$VERSION" \
            --sums SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --out tap
      - name: Publish the tap
        if: steps.guard.outputs.ready == 'true'
        working-directory: tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sdrmm.rb Casks/sdrminusminus.rb
          if git diff --cached --quiet; then
            echo "the tap already describes $VERSION"
            exit 0
          fi
          git commit -m "sdrmm $VERSION"
          git push
