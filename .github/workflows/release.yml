# Release artifacts (PLAN §15). Tag-driven; workflow_dispatch builds and uploads everything
# without publishing, so the pipeline can be exercised off a branch.
#
# Three rules run through every job here:
#
#  - The version comes from the tag and is stamped *once*, by the `version` job, which uploads
#    the rewritten Cargo.toml + Cargo.lock for everything downstream to check out over. Before
#    this existed the tag named the tarball and nothing else: bundles shipped as `0.0.0` and
#    `sdrmm --version` disagreed with the release it came from.
#
#  - Binaries and images are built `--no-default-features` (drops `soapy`, whose sys crate
#    links libSoapySDR) with the native pure-Rust backends on, because release artifacts must
#    launch with no shared library installed. Those flags live in `xtask`, not here.
#
#  - The web UI is built by whatever produces the artifact and its presence is then asserted.
#    crates/server/build.rs creates web/dist when it is missing, so a Rust build with no UI
#    *succeeds* and ships a 503 "not built" page — a silent failure this pipeline prevents.
#    `cargo xtask dist` does both, which is why one command reproduces a release artifact on a
#    laptop; the Dockerfile has the same two steps as its own stages.
#
# Three modes, one pipeline — the build jobs are identical in all of them and only the `version`
# job and the publish step know which is running:
#
#   tag       a real release, published from the tag's version
#   schedule  a nightly, published over the rolling `nightly` prerelease — but only if main has
#             moved since the last one, because a full matrix is twelve jobs and four of them
#             are macOS
#   dispatch  a rehearsal: builds and uploads everything, publishes nothing
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    # 03:00 UTC. Nothing downstream cares about the exact hour; this one is outside both
    # European and US working days, so a nightly is finished before anyone looks for it.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ghcr rejects an uppercase reference and `github.repository` carries the owner's canonical
  # casing (`Newspicel/…`), so the name is lowercased at use rather than interpolated raw.
  IMAGE_NAME: ghcr.io/newspicel/sdrminusminus
  # Enforced by `xtask check` against web/package.json and the Dockerfile — these three
  # are bumped by different tools and must move together.
  PNPM_VERSION: 11.15.1
  NODE_VERSION: 26

jobs:
  version:
    name: Stamp version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      # Every build job below hangs off this. Only a nightly can ever set it false.
      changed: ${{ steps.stamp.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      # Building xtask reaches sdrmm-server, so audiopus_sys' vendored libopus is compiled here
      # too — the one reason a manifest edit needs a C toolchain.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu
          save-if: false
      - id: stamp
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # The `nightly` tag is the marker: it points at the commit the last published
            # nightly was built from. Resolving it through /commits/ rather than reading the
            # ref dereferences the tag object, so this compares commit to commit.
            previous="$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)"
            if [ "$previous" = "$GITHUB_SHA" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "main is unchanged since the last nightly ($previous) — nothing to build."
              exit 0
            fi
            # YY.M.D, and every part of that is forced. It has to be plain major.minor.patch
            # with major <= 255, so neither `0.0.0-nightly.x` nor a four-digit year survives
            # the MSI bundler (`xtask set-version` rejects both up front). This says which
            # night a build came from, which is the whole point of running `sdrmm --version`
            # on a nightly; the commit is in the release notes.
            version="$(date -u +%y.%-m.%-d)"
          elif [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            # Dispatch runs are rehearsals and are never published, so they keep the manifest's
            # own version.
            version=0.0.0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cargo xtask set-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Two files, and every build job below starts by checking them out over its own copy.
      - uses: actions/upload-artifact@v7
        if: steps.stamp.outputs.changed == 'true'
        with:
          name: version-stamp
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: sdrmm (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          # The one cross build: Apple ships both slices in a single SDK, so the arm64 runner
          # produces the Intel binary without a sysroot of its own.
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    # Every other entry is a native runner — GitHub's hosted arm64 Linux runners remove the need
    # to cross-compile or emulate, so no sysroot, no cargo-zigbuild, no QEMU. The OS is pinned
    # rather than `-latest` because the build machine's glibc is the floor of every Linux
    # artifact we ship, and a silent bump would strand older Pi installs.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned nightly from rust-toolchain.toml; `xtask dist` adds the cross
      # target itself when `--target` names something other than the host.
      - run: rustup show
      # Before the version stamp on purpose: rust-cache keys on Cargo.lock, and stamping
      # rewrites every workspace entry in it. Restoring first means a release reuses the
      # dependency artifacts `main` already built, and only the workspace crates rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      # `xtask dist` builds the UI itself, so the toolchain has to be here rather than in a
      # shared artifact — which is also what lets one command reproduce this on a laptop.
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # audiopus_sys builds vendored libopus through the cmake crate.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: cargo xtask dist
        run: cargo xtask dist --target ${{ matrix.target }}
      # An artifact that reports a version other than the one it is named after is exactly the
      # bug this pipeline was rebuilt to close, so assert it rather than trust it. The staged
      # directory holds the same files the archive was packed from, which keeps this one step
      # portable across all three shells instead of needing a per-OS unpacker.
      # The Intel build cannot run on the arm64 runner, so it is checked for presence only.
      - name: Smoke the artifact
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          staged="dist/sdrmm-${VERSION}-${TARGET}"
          ls -l "$staged"
          test -s "$staged.tar.gz" || test -s "$staged.zip"
          if [ "$TARGET" = x86_64-apple-darwin ]; then exit 0; fi
          bin="$staged/sdrmm"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          printed="$("$bin" --version)"
          echo "$printed"
          test "$printed" = "sdrmm $VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: sdrmm-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  image:
    name: Image (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # One native runner per platform, each pushing an untagged manifest by digest; the merge
    # job below assembles them into one multi-arch tag. QEMU would work too and take hours.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Into the build context, so the binary inside the image reports the release version too.
      # Unlike the cargo jobs this cannot be reordered around the cache: Cargo.toml is a layer
      # input to the Dockerfile's dependency-compilation stage, so a tag build recompiles the
      # dependency tree from cold. That is a few minutes per platform, on a workflow that runs
      # per release — cheaper than teaching the Dockerfile to stamp itself.
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      # Artifact names cannot contain "/".
      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The web build and its index.html assertion are stages of the Dockerfile itself, so the
      # image cannot be published without an embedded UI either.
      - id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Image manifest
    needs: [version, image]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # The semver patterns need a tag ref and produce nothing on the other two triggers,
          # which is why `latest` and `nightly` are raw and mutually exclusive: a nightly must
          # never be what `docker pull` gives someone who asked for no tag at all.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # both substitutions are argument lists, not one word
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            bundles: dmg
          - label: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      # Before the version stamp, for the reason given in the binaries job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}
      - uses: actions/download-artifact@v8
        with:
          name: version-stamp
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Tauri v2's Linux prerequisites; cmake is for audiopus_sys' vendored libopus.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev cmake file
      # tauri-action drives the bundle itself, so the UI has to be on disk before it starts —
      # the Tauri shell serves the same embedded UI through the in-process server, and needs
      # web/dist just as much as the headless binary does.
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: Assert the UI built
        shell: bash
        run: test -f web/dist/index.html
      # `cargo xtask desktop --bundles` is the same build locally. CI goes through the action
      # because signing a macOS bundle needs the certificate imported into a temporary keychain
      # first, and that is the action's job.
      - uses: tauri-apps/tauri-action@v1
        env:
          # macOS bundles are signed and notarized, which is what these six carry: the first
          # three are the Developer ID Application certificate, the last three are the notary
          # credentials. Tauri creates and unlocks its own temporary keychain from the .p12, so
          # there is no KEYCHAIN_PASSWORD to set here.
          # If any are missing the build still succeeds and produces an *unsigned* .dmg —
          # Gatekeeper then quarantines the app with no ticket to staple, and users have to
          # clear the quarantine attribute by hand.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --no-default-features --features rtl-native,hackrf-native --bundles ${{ matrix.bundles }}
      # Flattened first: upload-artifact roots a multi-path artifact at the least common
      # ancestor of its search paths, which would nest the bundles under dmg/ deb/ appimage/
      # — and the release job below treats every downloaded entry as a file to attach.
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          find target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} bundles/ \;
          ls -l bundles
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: bundles/*
          if-no-files-found: error

  release:
    name: GitHub Release
    # workflow_dispatch runs stop at the uploaded artifacts; a tag and a nightly publish.
    if: github.ref_type == 'tag' || github.event_name == 'schedule'
    needs: [version, binaries, image-manifest, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Provenance: every published file gets a signed statement tying it to this workflow at
      # this commit, verifiable with `gh attestation verify <file> --repo <repo>`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{sdrmm-*,desktop-*}"
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          # `! -name SHA256SUMS`: the redirect creates the file before `find` runs, so without
          # it the manifest lists itself — hashed while still empty, since it sorts first.
          # shellcheck disable=SC2094  # that exclusion is exactly what makes this safe
          find . -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/*"
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # shellcheck disable=SC2046  # the find is an asset list, one argument per file
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: \`docker pull ${IMAGE_NAME}:${VERSION}\`" \
            $(find artifacts -type f | sort)

      # Rolling, so the download URLs are stable and always point at the newest build. The tag
      # is deleted with the release and recreated at this commit, which is also what makes it
      # usable as the change marker the `version` job reads — the tag *is* the record of what
      # the last nightly was built from.
      - name: Publish nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          notes=$(cat <<EOF
          Automated build of \`main\` at ${GITHUB_SHA}, published $(date -u '+%Y-%m-%d %H:%M UTC').

          Unstable by definition: this is whatever was on \`main\` last night, not a release.
          It is replaced every night, so these download URLs always point at the newest build.

          Container image: \`docker pull ${IMAGE_NAME}:nightly\`
          EOF
          )
          # shellcheck disable=SC2046  # the find is an asset list, one argument per file
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --prerelease \
            --notes "$notes" \
            $(find artifacts -type f | sort)
