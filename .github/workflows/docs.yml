# Builds the site (docs/ as an mdBook, site/ as the Astro landing page and demo) and publishes
# it to GitHub Pages on main. Pull requests build it but never deploy: a fork PR's GITHUB_TOKEN is read-only,
# so the Pages steps would fail on permissions rather than on anything the PR changed.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "web/src/**"
      - "web/e2e/demoSession.ts"
      - "web/package.json"
      - "assets/**"
      - "scripts/build-site.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "web/src/**"
      - "web/e2e/demoSession.ts"
      - "web/package.json"
      - "assets/**"
      - "scripts/build-site.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 11.15.1
  NODE_VERSION: 26

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Prebuilt binary; `cargo install mdbook` would cost minutes per run.
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            site/pnpm-lock.yaml
      # The demo page imports the app's components straight from web/.
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir site install --frozen-lockfile
      # book.toml sets create-missing = false, so a SUMMARY entry without a file fails here.
      - run: scripts/build-site.sh
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
