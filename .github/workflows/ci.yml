# CI mirrors the local gate 1:1 (CLAUDE.md): every job here is an `xtask` subcommand a developer
# can run unchanged — `check`, `test`, `smoke`, `desktop`, `audit`. No hardware — everything runs
# on `device-virtual`.
#
# Pull requests pay for Linux only. macOS bills at 10x the Linux minute rate and Windows at 2x,
# so both run on `main` and on release tags, where a platform-specific break still gets caught
# before it can ship. `workflow_dispatch` forces the full set onto a branch when a change is
# genuinely platform-shaped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all-platforms:
        description: "Run the macOS and Windows jobs on this branch too"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Enforced by `xtask check` against web/package.json and the Dockerfile — these three
  # are bumped by different tools and must move together.
  PNPM_VERSION: 11.15.1
  NODE_VERSION: 26

jobs:
  gate:
    name: Full gate (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # device-soapy links libSoapySDR; no modules or hardware needed (probe just returns
      # empty). --no-install-recommends is required: libsoapysdr0.8 recommends
      # soapysdr-modules-all, and loading real modules headless is fatal (SoapyUHD aborts).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsoapysdr-dev mesa-vulkan-drivers
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # Installs the pinned nightly + rustfmt/clippy from rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `check` is ordered cheapest-first internally (fmt and the web lints before clippy), so
      # a formatting break answers in seconds rather than after a cold workspace build.
      - name: cargo xtask check
        run: cargo xtask check
      - name: cargo xtask test
        run: cargo xtask test
      # Exercise WGSL compilation and the complete compute/readback path even on a headless
      # runner. Lavapipe is deliberately accepted by the test but rejected by production
      # selection, where a software adapter would only move CPU work around.
      - name: GPU FFT parity (Lavapipe)
        env:
          SDRMM_REQUIRE_GPU_FFT_TEST: "1"
        run: >
          cargo test -p sdrmm-engine --all-features
          --lib spectrum::tests::gpu_matches_cpu_when_a_hardware_adapter_is_available
          -- --ignored --exact
      # The browser flow is its own step because it needs a browser binary the other gates do
      # not; it drives the real server on `device-virtual`, so still no hardware.
      - name: install the smoke browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: cargo xtask smoke
        run: cargo xtask smoke
      # `retain-on-failure` (web/playwright.config.ts) already writes a trace and a page snapshot
      # per failed test; without this they die with the runner, and a browser failure that only
      # happens on CI is then a stack trace with nothing behind it.
      - name: keep the smoke trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-trace
          path: web/test-results
          retention-days: 7

  desktop:
    name: Desktop shell (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Tauri v2's Linux prerequisites; cmake is for audiopus_sys' vendored libopus.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libsoapysdr-dev cmake file
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-ubuntu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Its own job because `apps/desktop` is outside the workspace's `default-members` — the
      # gate above never compiles it. Without this, a break in the Tauri shell stayed invisible
      # until a tag was cut and the release job was the first thing to build it.
      #
      # Clippy only, not a bundle: the installers are release work, and the failure this job
      # exists to catch is a compile error. That is also why there is no Node here — the
      # compile gate needs no UI on disk (see the command's own comment).
      - name: cargo xtask desktop
        run: cargo xtask desktop

  image:
    name: Container image (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build without pushing, on the same gha cache scope the release job writes, so a broken
      # Dockerfile fails on the pull request that broke it instead of on release day.
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: false
          load: true
          tags: sdrmm:ci
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
      # The image is only as good as what it does on start: this asserts the binary runs and
      # that the UI really was embedded, which a `--version` check alone would not show.
      - name: Smoke the image
        run: |
          set -euo pipefail
          docker run --rm sdrmm:ci --version
          doctor="$(docker run --rm sdrmm:ci --doctor)"
          echo "$doctor"
          grep -q 'compiled backends:.*soapy' <<< "$doctor"
          grep -q 'core: 0.8.' <<< "$doctor"
          grep -q 'compiled backends:.*rtlsdr' <<< "$doctor"
          grep -q 'compiled backends:.*hackrf' <<< "$doctor"
          grep -qi 'airspy' <<< "$doctor"
          grep -qi 'bladerf' <<< "$doctor"
          grep -qi 'lms7' <<< "$doctor"
          grep -qi 'pluto' <<< "$doctor"
          grep -qi 'remote' <<< "$doctor"
          docker run --rm --detach --name sdrmm-ci --publish 8080:8080 sdrmm:ci
          trap 'docker rm --force sdrmm-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/api/state; then ok=1; break; fi
            sleep 1
          done
          test "${ok:-}" = 1 || { docker logs sdrmm-ci; exit 1; }
          # `build.rs` ships a 503 "not built" placeholder when web/dist is empty, so a served
          # index is the only proof the UI is actually in the image.
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root"'

  nix:
    name: Nix desktop package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            system: x86_64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - name: Build and smoke-test the package
        run: |
          nix flake check --print-build-logs
          nix build --impure --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = "${{ matrix.system }}";
              pkgs = builtins.getAttr system flake.inputs.nixpkgs.legacyPackages;
            in
            (builtins.getAttr system flake.packages).default.override {
              soapyPlugins = with pkgs; [
                soapyairspy
                soapybladerf
              ];
            }
          '
          test -x result/bin/sdrmm-desktop
          test ! -e result/bin/sdrmm
          test -f result/share/applications/sdrmm-desktop.desktop
          test -f result/share/icons/hicolor/128x128/apps/dev.newspicel.sdrmm.png
          ldd result/bin/.sdrmm-desktop-wrapped | grep -q 'libwebkit2gtk-4.1'
          ldd result/bin/.sdrmm-desktop-wrapped | grep -q 'libSoapySDR'
          grep -q 'SOAPY_SDR_PLUGIN_PATH' result/bin/sdrmm-desktop
          grep -q 'soapyairspy' result/bin/sdrmm-desktop
          grep -q 'soapybladerf' result/bin/sdrmm-desktop
          test -z "$(find -L result -path '*/SoapySDR/modules*' -print -quit)"
          set +e
          timeout 15s xvfb-run --auto-servernum result/bin/sdrmm-desktop >desktop.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat desktop.log
            exit 1
          fi

  advisories:
    name: Dependency advisories (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      # Restore-only on the gate's cache: this job builds the same xtask binary and has nothing
      # of its own worth storing.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Its own job, not a step in the gate: a new advisory lands on RustSec's schedule, not on
      # ours, and that must not read as "this pull request broke the build".
      - name: cargo xtask audit
        run: cargo xtask audit

  rust-macos:
    name: Rust tests (macos-arm64)
    # See the header: macOS bills at 10x and has never been the job that caught a break, so
    # pull requests skip it and `main` does not.
    if: github.event_name == 'push' || inputs.all-platforms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # device-soapy links libSoapySDR; no modules or hardware needed (probe just returns empty).
      - run: brew install soapysdr
      # `cargo xtask test` runs the web unit tests too, so it needs pnpm + node.
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask test

  desktop-windows:
    name: Desktop shell (windows)
    # Same rule as macOS above, for the same reason at 2x instead of 10x. Windows is the one
    # platform whose dependency graph nothing else compiles: `windows-rs` appears in it twice
    # (Tauri's 0.61 next to wgpu's 0.62), so a lockfile that unifies the two wrongly still
    # builds cleanly on Linux and macOS and only fails here. Before this job the release matrix
    # was the first thing to find that out, on tag day.
    if: github.event_name == 'push' || inputs.all-platforms
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # device-soapy links SoapySDR. The same pinned conda lock the release jobs build against,
      # so the gate and the artifact see one runtime; nothing is loaded, only linked.
      - id: soapy
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: 2.8.1-0
          environment-file: packaging/soapy/conda-win-64.lock
          environment-name: sdrmm-soapy-x86_64-pc-windows-msvc
          create-args: --platform win-64
          cache-environment: true
      # soapysdr-sys finds Windows installs by walking PATH for SoapySDR.dll with ../include and
      # ../lib beside it — the conda prefix's layout, which is why this needs no SOAPY_SDR_ROOT.
      - name: Configure pinned Soapy build runtime
        shell: bash
        env:
          PREFIX: ${{ steps.soapy.outputs.environment-path }}
        run: echo "$PREFIX/Library/bin" >> "$GITHUB_PATH"
      # `desktop` rather than `test`: it compiles the Tauri shell and the whole engine/server
      # chain under it — both halves of the Windows graph in one command — and needs neither
      # Node nor a browser to do it.
      - name: cargo xtask desktop
        run: cargo xtask desktop
