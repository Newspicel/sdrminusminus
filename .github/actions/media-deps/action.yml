name: Broadcast media libraries
description: Build the pinned media decoders for the host and optional release target
inputs:
  target:
    description: Additional target triple
    default: ""
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y clang libclang-dev nasm python3 make
    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
    - if: runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        install: make diffutils
        path-type: inherit
    # LLVM 22 stopped libclang.dll crashing the process on exit after bindgen unloads it.
    - if: runner.os == 'Windows'
      id: llvm
      uses: actions/cache@v5
      with:
        path: .llvm
        key: libclang-23.1.2-${{ runner.arch }}
    - if: runner.os == 'Windows' && steps.llvm.outputs.cache-hit != 'true'
      shell: bash
      env:
        ARCH: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
      run: |
        name="clang+llvm-23.1.2-$ARCH-pc-windows-msvc"
        curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/$name.tar.xz"
        mkdir -p .llvm
        tar -xJf llvm.tar.xz -C .llvm --strip-components 1 "$name/bin/libclang.dll" "$name/lib/clang"
        rm llvm.tar.xz
    # MSYS2 stays off the job's PATH: its `usr/bin` carries a `link.exe` that would shadow the
    # MSVC linker for every later cargo step. The media script prepends it for its own children.
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "MEDIA_SHELL_BIN=${{ steps.msys2.outputs.msys2-location }}\usr\bin;C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        "LIBCLANG_PATH=$env:GITHUB_WORKSPACE\.llvm\bin" >> $env:GITHUB_ENV
    - uses: actions/cache@v5
      with:
        path: .media
        key: media-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('scripts/build-media.py') }}
    - shell: bash
      env:
        MEDIA_TARGET: ${{ inputs.target }}
      run: |
        python3 scripts/build-media.py
        if [ -n "$MEDIA_TARGET" ]; then python3 scripts/build-media.py --target "$MEDIA_TARGET"; fi
        echo "FFMPEG_DIR=$(python3 scripts/build-media.py --print-prefix)" >> "$GITHUB_ENV"
