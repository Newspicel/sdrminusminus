name: Broadcast media libraries
description: Build the pinned media decoders for the host and optional release target
inputs:
  target:
    description: Additional target triple
    default: ""
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y clang libclang-dev nasm python3 make
    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
    - if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        install: make diffutils
        path-type: inherit
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "C:\msys64\usr\bin" >> $env:GITHUB_PATH
        "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
    - uses: actions/cache@v5
      with:
        path: target/media
        key: media-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('scripts/build-media.py') }}
    - shell: bash
      env:
        MEDIA_TARGET: ${{ inputs.target }}
      run: |
        python3 scripts/build-media.py
        if [ -n "$MEDIA_TARGET" ]; then python3 scripts/build-media.py --target "$MEDIA_TARGET"; fi
        python3 -c 'import importlib.util, os; s=importlib.util.spec_from_file_location("media", "scripts/build-media.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); p=m.ROOT / "target/media" / m.target_name(); open(os.environ["GITHUB_ENV"], "a").write("FFMPEG_DIR="+str(p)+"\n")'
