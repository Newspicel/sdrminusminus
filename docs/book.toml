[book]
title = "sdr--"
description = "Install, operate, and develop sdr--, a software-defined radio application for desktop and browser."
authors = ["sdr-- contributors"]
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["custom.css"]
no-section-label = true
git-repository-url = "https://github.com/Newspicel/sdrminusminus"
edit-url-template = "https://github.com/Newspicel/sdrminusminus/edit/main/docs/{path}"
site-url = "/sdrminusminus/"

[output.html.fold]
enable = true
level = 1
