[package]
name = "sdrmm-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["soapy", "net-client"]
soapy = ["dep:sdrmm-device-soapy"]
# rtl_tcp and SpyServer clients. Pure `std::net`, so it costs a release artifact nothing and is
# part of the minimal build.
net-client = ["dep:sdrmm-device-net"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
sdrmm-device.workspace = true
sdrmm-device-virtual.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }
sdrmm-device-net = { workspace = true, optional = true }
sdrmm-channels.workspace = true
sdrmm-recorder.workspace = true
opus.workspace = true
num-complex.workspace = true
rtrb.workspace = true
arc-swap.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tempfile.workspace = true
sdrmm-channels = { workspace = true, features = ["test-signals"] }
