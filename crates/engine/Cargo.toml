[package]
name = "sdrmm-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Every hardware backend is a feature (PLAN §3). The native ones are default-on because they
# are pure Rust and are what makes a release artifact launch with no C dependency (PLAN §15);
# `soapy` is default-on for development but omitted from release builds, so
# `--no-default-features --features rtl-native,hackrf-native` must build a Soapy-free binary.
[features]
default = ["soapy", "rtl-native", "hackrf-native"]
soapy = ["dep:sdrmm-device-soapy"]
rtl-native = ["dep:sdrmm-device-rtlsdr"]
hackrf-native = ["dep:sdrmm-device-hackrf"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
sdrmm-device.workspace = true
sdrmm-device-virtual.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }
sdrmm-device-rtlsdr = { workspace = true, optional = true }
sdrmm-device-hackrf = { workspace = true, optional = true }
sdrmm-channels.workspace = true
sdrmm-recorder.workspace = true
opus.workspace = true
num-complex.workspace = true
rtrb.workspace = true
arc-swap.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tempfile.workspace = true
# Reference modulators for the decoder end-to-end runs (PLAN §14): one encoder per protocol,
# shared with the channel unit tests and `xtask fixtures`.
sdrmm-channels = { workspace = true, features = ["test-signals"] }
