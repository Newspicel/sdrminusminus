[package]
name = "sdrmm-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["soapy", "sdrplay", "cr8", "rtlsdr", "hackrf", "airspy", "airspyhf", "ad936x", "net-client", "gpu-fft"]
soapy = ["dep:sdrmm-device-soapy"]
# SDRplay RSP receivers through the vendor API, which is resolved at runtime and never linked,
# so this costs a release artifact nothing and simply finds no hardware without it installed.
sdrplay = ["dep:sdrmm-device-sdrplay"]
# The Dragon Labs CR-8 coherent receiver through its own SDK, resolved at runtime like the
# SDRplay API and never linked, so a build without the library installed simply finds no CR-8.
cr8 = ["dep:sdrmm-device-cr8"]
# RTL2832U and HackRF over the pure-Rust USB stack. Neither links a C library, so both are part
# of the minimal build and of every release artifact.
rtlsdr = ["dep:sdrmm-device-rtlsdr"]
hackrf = ["dep:sdrmm-device-hackrf"]
airspy = ["dep:sdrmm-device-airspy"]
airspyhf = ["dep:sdrmm-device-airspyhf"]
# AntSDR, PlutoSDR and every other AD936x board that serves libiio, over ethernet or usb. The
# protocol is spoken directly, so this links no vendor library either.
ad936x = ["dep:sdrmm-device-ad936x"]
# rtl_tcp, SpyServer and SDRconnect clients. Pure `std::net`, so it costs a release artifact
# nothing and is part of the minimal build.
net-client = [
    "dep:sdrmm-device-rtltcp",
    "dep:sdrmm-device-spyserver",
    "dep:sdrmm-device-sdrconnect",
]
# Headless wgpu compute. Runtime selection still keeps small transforms on rustfft and falls
# back to it when the host has no suitable hardware adapter.
gpu-fft = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
sdrmm-device.workspace = true
sdrmm-device-virtual.workspace = true
sdrmm-device-recording.workspace = true
sdrmm-device-siggen.workspace = true
sdrmm-device-array.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }
sdrmm-device-sdrplay = { workspace = true, optional = true }
sdrmm-device-cr8 = { workspace = true, optional = true }
sdrmm-device-rtlsdr = { workspace = true, optional = true }
sdrmm-device-hackrf = { workspace = true, optional = true }
sdrmm-device-airspy = { workspace = true, optional = true }
sdrmm-device-airspyhf = { workspace = true, optional = true }
sdrmm-device-ad936x = { workspace = true, optional = true }
sdrmm-device-rtltcp = { workspace = true, optional = true }
sdrmm-device-spyserver = { workspace = true, optional = true }
sdrmm-device-sdrconnect = { workspace = true, optional = true }
sdrmm-channels.workspace = true
sdrmm-recorder.workspace = true
opus.workspace = true
num-complex.workspace = true
rtrb.workspace = true
arc-swap.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
sdrmm-test-support.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tempfile.workspace = true
sdrmm-channels = { workspace = true, features = ["test-signals"] }
serde_json.workspace = true
