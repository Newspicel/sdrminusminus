[package]
name = "sdrmm-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["soapy", "sdrplay", "net-client", "gpu-fft"]
soapy = ["dep:sdrmm-device-soapy"]
# SDRplay RSP receivers through the vendor API, which is resolved at runtime and never linked,
# so this costs a release artifact nothing and simply finds no hardware without it installed.
sdrplay = ["dep:sdrmm-device-sdrplay"]
# rtl_tcp and SpyServer clients. Pure `std::net`, so it costs a release artifact nothing and is
# part of the minimal build.
net-client = ["dep:sdrmm-device-net"]
# Headless wgpu compute. Runtime selection still keeps small transforms on rustfft and falls
# back to it when the host has no suitable hardware adapter.
gpu-fft = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
sdrmm-device.workspace = true
sdrmm-device-virtual.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }
sdrmm-device-sdrplay = { workspace = true, optional = true }
sdrmm-device-net = { workspace = true, optional = true }
sdrmm-channels.workspace = true
sdrmm-recorder.workspace = true
opus.workspace = true
num-complex.workspace = true
rtrb.workspace = true
arc-swap.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tempfile.workspace = true
sdrmm-channels = { workspace = true, features = ["test-signals"] }
