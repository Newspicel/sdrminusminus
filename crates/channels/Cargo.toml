[package]
name = "sdrmm-channels"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Exposes `testgen`, the reference modulators the engine's end-to-end tests and
# `cargo xtask fixtures` build signals with (). Test-only; never in a release build.
test-signals = []

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
# The §3.2 `channels → modem` edge (): symbol pulses come from `modem::pulse` — the
# live matched filters use it today, the phase-3 engines land here too, so it is unconditional
# even while `testgen` sits behind `test-signals`.
sdrmm-modem.workspace = true
num-complex.workspace = true
thiserror.workspace = true
blip25-vocoder.workspace = true
codec2.workspace = true

[build-dependencies]
# Builds the small, statically linked first-generation AMBE decoder used only by D-STAR.
# There is no runtime system-library dependency.
cc.workspace = true

[dev-dependencies]
rustfft.workspace = true
# The coded-baseline artifacts (tests/dmr_soft_gain.rs) bundle three labelled curves per
# file, a shape `sweep::save_json` (one bare Curve) does not cover.
serde.workspace = true
serde_json.workspace = true
# Dev-dependency on ourselves so integration tests see `testgen` (gated on `test-signals`,
# which `#[cfg(test)]` alone does not enable for tests/ targets).
sdrmm-channels = { workspace = true, features = ["test-signals"] }
# Generate known voice frames for the DMR receive-side end-to-end test. Production keeps only
# the dependency's decode feature enabled.
blip25-vocoder = { workspace = true, features = ["encode"] }
