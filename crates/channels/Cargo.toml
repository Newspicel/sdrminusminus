[package]
name = "sdrmm-channels"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Exposes `testgen`, the reference modulators the engine's end-to-end tests and
# `cargo xtask fixtures` build signals with (PLAN §14). Test-only; never in a release build.
test-signals = []

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
num-complex.workspace = true
thiserror.workspace = true

[dev-dependencies]
rustfft.workspace = true
# BER/limits harness for the phase-0 DMR baseline (MODEM-PLAN §7); dev-only until phase 3
# puts modem engines on the receive path.
sdrmm-modem.workspace = true
# Dev-dependency on ourselves so integration tests see `testgen` (gated on `test-signals`,
# which `#[cfg(test)]` alone does not enable for tests/ targets).
sdrmm-channels = { workspace = true, features = ["test-signals"] }
