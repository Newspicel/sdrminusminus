[package]
name = "sdrmm-channels"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
test-signals = []

[dependencies]
sdrmm-wire.workspace = true
sdrmm-dsp.workspace = true
sdrmm-modem.workspace = true
num-complex.workspace = true
rustfft.workspace = true
thiserror.workspace = true
blip25-vocoder.workspace = true
codec2.workspace = true
mfsk-core.workspace = true
serde_json.workspace = true
xng-mode-dsc.workspace = true
xng-mode-stdc.workspace = true
xng-mode-aero.workspace = true
xng-mode-vdl2.workspace = true
xng-mode-hfdl.workspace = true
xng-mode-iridium.workspace = true
xng-types.workspace = true

[build-dependencies]
# Builds the small, statically linked first-generation AMBE decoder used only by D-STAR.
# There is no runtime system-library dependency.
cc.workspace = true

[dev-dependencies]
sdrmm-test-support.workspace = true
sdrmm-modem-test-support.workspace = true
# The coded-baseline artifacts (tests/dmr_soft_gain.rs) bundle three labelled curves per
# file, a shape `sweep::save_json` (one bare Curve) does not cover.
serde.workspace = true
serde_json.workspace = true
# Dev-dependency on ourselves so integration tests see `testgen` (gated on `test-signals`,
# which `#[cfg(test)]` alone does not enable for tests/ targets).
sdrmm-channels = { workspace = true, features = ["test-signals"] }
blip25-vocoder = { workspace = true, features = ["encode"] }
xng-acars.workspace = true
