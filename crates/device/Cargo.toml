[package]
name = "sdrmm-device"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The shared bulk USB transport seen as a `CaptureStream`. Off by default so a build with no
# native backend never compiles a transport it cannot use.
usb = ["dep:sdrmm-usb-stream"]
# `std::net` sockets seen as a capture transport: the endpoint parser and the connection wrapper
# every network backend shares. Pure std, so it pulls in nothing.
net = []
# The loopback server the network backends are tested against. Off outside their own test builds,
# so nothing ships a listener it does not use.
test-util = ["net"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-usb-stream = { workspace = true, optional = true }
futures.workspace = true
num-complex.workspace = true
nusb.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
