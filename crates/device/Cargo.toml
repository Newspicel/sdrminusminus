[package]
name = "sdrmm-device"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The shared USB transport seen as a `CaptureStream`. Off by default so a Soapy-only or
# virtual-only build never compiles a USB stack it cannot use (PLAN §3); the two native
# backends turn it on.
usb = ["dep:sdrmm-usb-stream"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-usb-stream = { workspace = true, optional = true }
num-complex.workspace = true
thiserror.workspace = true
tracing.workspace = true
