[package]
name = "sdrmm-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Passthrough to the engine's backend gate (PLAN §3 Soapy-free build).
[features]
default = ["soapy"]
soapy = ["sdrmm-engine/soapy"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-engine.workspace = true
sdrmm-dsp.workspace = true

# `macros` for the FromRequest/FromRequestParts derives that remap extractor rejections
# onto the ApiError contract.
axum = { workspace = true, features = ["ws", "macros"] }
tower.workspace = true
tower-http.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true

rusqlite.workspace = true
jiff.workspace = true
thiserror.workspace = true

rust-embed.workspace = true
mime_guess.workspace = true
tracing.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# Hermetic test engine (virtual driver only): tests must never enumerate live Soapy modules.
sdrmm-device.workspace = true
sdrmm-device-virtual.workspace = true
tokio-tungstenite.workspace = true
