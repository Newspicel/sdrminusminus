[package]
name = "sdrmm-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Passthrough to the engine's deliberate minimal-build gates.
[features]
default = ["soapy", "net-client", "gpu-fft"]
soapy = ["sdrmm-engine/soapy", "dep:sdrmm-device-soapy"]
net-client = ["sdrmm-engine/net-client"]
gpu-fft = ["sdrmm-engine/gpu-fft"]

[dependencies]
sdrmm-wire.workspace = true
sdrmm-engine.workspace = true
sdrmm-dsp.workspace = true
sdrmm-device.workspace = true
sdrmm-device-soapy = { workspace = true, optional = true }
sdrmm-recorder.workspace = true
sdrmm-tools.workspace = true

# `macros` for the FromRequest/FromRequestParts derives that remap extractor rejections
# onto the ApiError contract.
axum = { workspace = true, features = ["ws", "macros"] }
tower.workspace = true
tower-http.workspace = true
futures.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-serial.workspace = true

rmcp.workspace = true
schemars.workspace = true

serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true

rusqlite.workspace = true
jiff.workspace = true
thiserror.workspace = true

rust-embed.workspace = true
mime_guess.workspace = true
tracing.workspace = true

# `--doctor`'s USB-permission check asks for the effective uid, which only the Linux arm needs.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# Hermetic test engine (virtual driver only): tests must never enumerate live Soapy modules.
sdrmm-device-virtual.workspace = true
tokio-tungstenite.workspace = true
num-complex.workspace = true
tempfile.workspace = true
