# `cargo xtask …` — the only entry points (CLAUDE.md); CI invokes them verbatim.
[alias]
xtask = "run --package xtask --"

# Next-gen borrow checker (PLAN §15). One line to drop if a nightly pin misbehaves.
[build]
rustflags = ["-Zpolonius=next"]

# A crate has to sit in the registry for a day before this repo will resolve it, so a compromised
# publish has a window in which to be caught — the same gate `web/pnpm-workspace.yaml` puts on npm
# packages. Unstable, so it needs the -Z opt-in beside it. To take a version early, resolve that
# one with `CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow` — cargo has no exclude list.
[unstable]
min-publish-age = true

[registry]
global-min-publish-age = "1 day"
