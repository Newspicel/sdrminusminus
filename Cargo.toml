[workspace]
resolver = "3"
members = [
    "crates/test-support",
    "crates/wire",
    "crates/dsp",
    "crates/modem",
    "crates/modem-test-support",
    "crates/device",
    "crates/device-virtual",
    "crates/device-recording",
    "crates/device-siggen",
    "crates/device-array",
    "crates/device-ad936x",
    "crates/device-airspy",
    "crates/device-airspyhf",
    "crates/device-soapy",
    "crates/device-sdrplay",
    "crates/device-sdrconnect",
    "crates/device-rtlsdr",
    "crates/device-cr8",
    "crates/device-hackrf",
    "crates/device-rtltcp",
    "crates/device-spyserver",
    "crates/usb-stream",
    "crates/channels",
    "crates/cps",
    "crates/recorder",
    "crates/engine",
    "crates/tools",
    "crates/server",
    "apps/sdrmm",
    "apps/desktop",
    "xtask",
]

default-members = [
    "crates/test-support",
    "crates/wire",
    "crates/dsp",
    "crates/modem",
    "crates/modem-test-support",
    "crates/device",
    "crates/device-virtual",
    "crates/device-recording",
    "crates/device-siggen",
    "crates/device-array",
    "crates/device-ad936x",
    "crates/device-airspy",
    "crates/device-airspyhf",
    "crates/device-soapy",
    "crates/device-sdrplay",
    "crates/device-sdrconnect",
    "crates/device-rtlsdr",
    "crates/device-cr8",
    "crates/device-hackrf",
    "crates/device-rtltcp",
    "crates/device-spyserver",
    "crates/usb-stream",
    "crates/channels",
    "crates/cps",
    "crates/recorder",
    "crates/engine",
    "crates/tools",
    "crates/server",
    "apps/sdrmm",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "GPL-3.0-or-later"
authors = ["SDR-- contributors"]
repository = "https://github.com/newspicel/sdrminusminus"
rust-version = "1.98"

[workspace.dependencies]
tun-rs = { version = "2.8.10", features = ["async"] }
sdrmm-test-support = { path = "crates/test-support" }
# Internal crates
sdrmm-wire = { path = "crates/wire" }
sdrmm-dsp = { path = "crates/dsp" }
sdrmm-modem = { path = "crates/modem" }
sdrmm-modem-test-support = { path = "crates/modem-test-support" }
sdrmm-device = { path = "crates/device" }
sdrmm-device-virtual = { path = "crates/device-virtual" }
sdrmm-device-recording = { path = "crates/device-recording" }
sdrmm-device-siggen = { path = "crates/device-siggen" }
sdrmm-device-array = { path = "crates/device-array" }
sdrmm-device-ad936x = { path = "crates/device-ad936x" }
sdrmm-device-airspy = { path = "crates/device-airspy" }
sdrmm-device-airspyhf = { path = "crates/device-airspyhf" }
sdrmm-device-soapy = { path = "crates/device-soapy" }
sdrmm-device-sdrplay = { path = "crates/device-sdrplay" }
sdrmm-device-sdrconnect = { path = "crates/device-sdrconnect" }
sdrmm-device-rtlsdr = { path = "crates/device-rtlsdr" }
sdrmm-device-cr8 = { path = "crates/device-cr8" }
sdrmm-device-hackrf = { path = "crates/device-hackrf" }
sdrmm-device-rtltcp = { path = "crates/device-rtltcp" }
sdrmm-device-spyserver = { path = "crates/device-spyserver" }
sdrmm-usb-stream = { path = "crates/usb-stream" }
sdrmm-channels = { path = "crates/channels" }
sdrmm-cps = { path = "crates/cps" }
sdrmm-recorder = { path = "crates/recorder" }
sdrmm-tools = { path = "crates/tools" }
# default-features = false so binaries opt into `soapy` themselves — a member manifest cannot
# disable a workspace dep's defaults, only add to them (needed for the minimal build).
sdrmm-engine = { path = "crates/engine", default-features = false }
sdrmm-server = { path = "crates/server", default-features = false }

# Async runtime / web
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
# TLS termination for `--tls-*`. `tls-rustls-no-provider` keeps the crypto provider ours to pick:
# the graph already enables both rustls backends, so an implicit default would be ambiguous.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = "0.23"
rcgen = "0.14"
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "fs", "trace"] }
futures = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
rumqttc = { package = "rumqttc-v4-next", version = "0.34.0", default-features = false, features = ["use-rustls"] }
url = "2.5.8"
tokio-tungstenite = "0.30"
tokio-serial = "5.5.0"
serialport = { version = "4.9.0", default-features = false }

# MCP server (, §18): streamable HTTP mounted on the same axum app. `schemars` derives
# the tool argument schemas and must match the version rmcp itself depends on.
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2"

# Serde + OpenAPI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
mime_guess = "2"

# Device backends
# Reads the USB bus without opening devices, so a hotplug check cannot disturb a running stream
# or wake the vendor SoapySDR modules.
nusb = "0.2.7"
# SoapySDR, the SDRplay API and the CR-8 library are all resolved at runtime from wherever their
# installers put them, so nothing here links or ships them and a machine without one simply
# reports no hardware of that kind.
libloading = "0.9"

# DSP
num-complex = "0.4"
rustfft = "6"
realfft = "3"
mfsk-core = { version = "0.10.0", default-features = false, features = ["std", "fft-rustfft", "ft8", "ft4", "wspr"] }
xng-mode-dsc = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
xng-mode-stdc = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
xng-mode-aero = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
xng-mode-vdl2 = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
xng-mode-hfdl = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
xng-mode-iridium = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
xng-types = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
xng-acars = { git = "https://github.com/airframesio/xng", rev = "6a768a2f843099171d7ed08df9fe0f3ba0678f25" }
rtrb = "0.4"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }

# Audio (libopus via vendored build, )
opus = "0.4"
blip25-vocoder = { version = "1.0", default-features = false, features = ["decode"] }
codec2 = "0.3.1"
symphonia-core = "0.6.1"
symphonia-bundle-mp3 = { version = "0.6.1", default-features = false, features = ["mp2"] }
ffmpeg-the-third = { version = "6.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

# Persistence
rusqlite = { version = "0.40", features = ["bundled"] }
jiff = "0.2"
dirs = "6"

# Static asset embedding
rust-embed = "8"

sha2 = "0.11"

# macOS scheduling: keeps App Nap from throttling the capture threads of a window that is not
# frontmost. Already in the tree through Tauri; pinned here so the headless build shares it.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

# Windows scheduling: threads there start at the priority of everything else on the machine, and
# a capture thread that waits its turn loses USB transfers.
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

# Errors / logging / util
libc = "0.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
# Cross-platform file events for `cargo xtask dev`; xtask only.
notify = "8.2.0"

# Scoped temp dirs for filesystem tests (SigMF IO, recordings REST); dev-dependency only.
tempfile = "3"

criterion = "0.8"
cc = "1"

resvg = { version = "0.48", default-features = false }

# PNG encoding for the captured-picture store; the same version resvg already pulls in.
png = { version = "0.18", default-features = false }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# `cargo xtask sanitize` sets this so the wall-clock gates stop holding an instrumented build
# to real time.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sanitized)"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The container gate builds the real Dockerfile only to prove it still builds and that the
# binary boots. Neither needs whole-program optimisation, and paying for it on a 4-core runner
# was most of that job's ten minutes. Release artifacts are never built from this profile.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.sdrmm-dsp]
opt-level = 3

[profile.dev.package.sdrmm-modem]
opt-level = 3

[profile.dev.package.sdrmm-modem-test-support]
opt-level = 3

[profile.dev.package.sdrmm-channels]
opt-level = 3

[profile.dev.package.sdrmm-engine]
opt-level = 3

[profile.dev.package.sdrmm-device-rtltcp]
opt-level = 3

[profile.dev.package.sdrmm-device-spyserver]
opt-level = 3

[profile.dev.package.sdrmm-device-sdrconnect]
opt-level = 3

[profile.dev.package.sdrmm-usb-stream]
opt-level = 3

[profile.dev.package.sdrmm-device-rtlsdr]
opt-level = 3

[profile.dev.package.sdrmm-device-hackrf]
opt-level = 3

[profile.dev.package.sdrmm-device-ad936x]
opt-level = 3

[profile.dev.package.sdrmm-device-virtual]
opt-level = 3

[profile.dev.package.sdrmm-device-recording]
opt-level = 3

[profile.dev.package.sdrmm-device-siggen]
opt-level = 3

[profile.dev.package.sdrmm-recorder]
opt-level = 3
