[workspace]
resolver = "3"
members = [
    "crates/wire",
    "crates/dsp",
    "crates/modem",
    "crates/device",
    "crates/device-virtual",
    "crates/device-soapy",
    "crates/device-net",
    "crates/channels",
    "crates/recorder",
    "crates/engine",
    "crates/tools",
    "crates/server",
    "apps/sdrmm",
    "apps/desktop",
    "xtask",
]
# The default gate (cargo build/clippy/test) skips the Tauri app: it pulls the platform
# webview toolchain (webkit2gtk on Linux) and a built frontend, handled at M5 packaging.
# Build it explicitly with `cargo build -p sdrmm-desktop` / `cargo tauri`.
default-members = [
    "crates/wire",
    "crates/dsp",
    "crates/modem",
    "crates/device",
    "crates/device-virtual",
    "crates/device-soapy",
    "crates/device-net",
    "crates/channels",
    "crates/recorder",
    "crates/engine",
    "crates/tools",
    "crates/server",
    "apps/sdrmm",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "GPL-3.0-or-later"
authors = ["sdr-- contributors"]
repository = "https://github.com/newspicel/sdrminusminus"
rust-version = "1.99"

[workspace.dependencies]
# Internal crates
sdrmm-wire = { path = "crates/wire" }
sdrmm-dsp = { path = "crates/dsp" }
sdrmm-modem = { path = "crates/modem" }
sdrmm-device = { path = "crates/device" }
sdrmm-device-virtual = { path = "crates/device-virtual" }
sdrmm-device-soapy = { path = "crates/device-soapy" }
sdrmm-device-net = { path = "crates/device-net" }
sdrmm-channels = { path = "crates/channels" }
sdrmm-recorder = { path = "crates/recorder" }
sdrmm-tools = { path = "crates/tools" }
# default-features = false so binaries opt into `soapy` themselves — a member manifest cannot
# disable a workspace dep's defaults, only add to them (needed for the minimal build).
sdrmm-engine = { path = "crates/engine", default-features = false }
sdrmm-server = { path = "crates/server", default-features = false }

# Async runtime / web
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "fs", "trace"] }
futures = "0.3"
# WS client for exercising the hub in server tests only. Pinned to whatever axum's `ws` feature
# resolves to — *not* to the newest release — so the graph holds one tungstenite and not two.
# Newer versions exist; moving to one before axum does compiles the whole stack twice for the
# benefit of a dev-dependency. Bump this when axum bumps, and not before (deny/dependabot both
# know: see the ignore in .github/dependabot.yml).
tokio-tungstenite = "0.29"
tokio-serial = "5.5.0"

# MCP server (, §18): streamable HTTP mounted on the same axum app. `schemars` derives
# the tool argument schemas and must match the version rmcp itself depends on.
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2"

# Serde + OpenAPI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
mime_guess = "2"

# Device backends
# Upstream 0.5.1 exposes the stream API but not getSettingInfo. This pinned fork adds only safe
# wrappers for setting metadata and runtime/module diagnostics over the existing soapysdr-sys API.
soapysdr = { git = "https://github.com/Newspicel/rust-soapysdr", rev = "5f05fb65366d75e4706285df5bc3864abbd51284" }

# DSP
num-complex = "0.4"
rustfft = "6"
realfft = "3"
rtrb = "0.3"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }

# Audio (libopus via vendored build, )
opus = "0.3"
# DMR's standardized vocoder socket is codec-agnostic, but interoperable Tier II/III radios
# conventionally carry three AMBE+2 3,600 x 2,450 frames in it.
blip25-vocoder = { version = "1.0", default-features = false, features = ["decode"] }
# M17's open 3,200 bit/s voice-only and 1,600 bit/s voice-plus-data modes. This is a
# pure-Rust port of Codec2; the channel only needs the decoder, but the crate exposes
# encode/decode together.
codec2 = "0.3.1"

# Persistence
rusqlite = { version = "0.40", features = ["bundled"] }
jiff = "0.2"
# Platform data dir for the headless binary's default DB location ().
dirs = "6"

# Static asset embedding
rust-embed = "8"

# Content-addresses the license texts `cargo xtask licenses` harvests, so several hundred
# byte-identical Apache-2.0 copies are stored once. xtask only.
sha2 = "0.11"

# Errors / logging / util
libc = "0.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
# Cross-platform file events for `cargo xtask dev`; xtask only.
notify = "8.2.0"

# Scoped temp dirs for filesystem tests (SigMF IO, recordings REST); dev-dependency only.
tempfile = "3"

# Performance baselines for the modem catalog ( §4.2); dev-dependency only.
criterion = "0.8"
cc = "1"

# `cargo xtask icons` rasterises assets/icon.svg; xtask only, nothing shipped links it.
# No default features: the mark is paths, and `text` would pull a whole font database into a
# tool that never lays out a glyph. It re-exports the `tiny_skia` the pixmaps come from.
resvg = { version = "0.48", default-features = false }

[workspace.lints.clippy]
# Hot-path discipline (, CLAUDE.md): no panics outside tests/startup.
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `cargo xtask dev` runs the dev profile, and an unoptimized DSP plane is not merely slow — it
# is wrong. Measured against a 2 MS/s RTL-SDR, the debug build saturated a core, overran the
# capture ring by 1.4 M samples/s (~70% of the stream discarded) and dropped the spectrum tap
# from 30 fps to ~10. Real-time code has to be built as real-time code even while developing.
#
# Only the signal path is optimized: `server`, `wire` and the app crates are edited many times
# an hour and stay at opt-level 0 so their rebuilds stay in seconds. `debug-assertions` are
# untouched, so every overflow and slice check still fires.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.sdrmm-dsp]
opt-level = 3

[profile.dev.package.sdrmm-modem]
opt-level = 3

[profile.dev.package.sdrmm-channels]
opt-level = 3

[profile.dev.package.sdrmm-engine]
opt-level = 3

[profile.dev.package.sdrmm-device-net]
opt-level = 3

[profile.dev.package.sdrmm-device-virtual]
opt-level = 3

[profile.dev.package.sdrmm-recorder]
opt-level = 3
